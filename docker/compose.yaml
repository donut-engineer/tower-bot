# Isaac Sim 6.2.0, headless, with this repo mounted at /workspace.
# Use docker/run.sh rather than calling this directly.
#
# Host needs: NVIDIA driver, Docker, NVIDIA Container Toolkit. Native Linux only (not WSL2).

services:
  isaac-sim:
    image: nvcr.io/nvidia/isaac-sim:6.2.0
    user: "1234:1234"              # the image's built-in user (non-root)
    # No ports or host networking: scripts are headless and need no inbound access.
    # The WebRTC livestream will need `network_mode: host`; add it in a separate GUI service.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      ACCEPT_EULA: "Y"             # accepts the NVIDIA Isaac Sim license on your behalf
      # Expose the graphics (Vulkan) driver too, not just CUDA: Isaac Sim's RTX renderer needs it
      # even headless.
      NVIDIA_DRIVER_CAPABILITIES: all
      # PRIVACY_CONSENT is left unset (no telemetry consent). Set it to "Y" to opt in.
    entrypoint: ["/isaac-sim/python.sh"]
    working_dir: /workspace
    volumes:
      # Repo read-only so the container can't touch source or .git (e.g. hooks);
      # only the USD output dir is writable.
      - ..:/workspace:ro
      - ../robot_description/usd:/workspace/robot_description/usd:rw
      # Caches/logs/config live in host dirs under ISAAC_CACHE (default ~/docker/isaac-sim),
      # created by run.sh and made writable for UID 1234 via ACLs. Named volumes were
      # root-owned, which broke warp and the Kit data store.
      - ${ISAAC_CACHE:?run via docker/run.sh}/cache/main:/isaac-sim/.cache:rw
      - ${ISAAC_CACHE}/cache/computecache:/isaac-sim/.nv/ComputeCache:rw
      - ${ISAAC_CACHE}/cache/kit:/isaac-sim/kit/cache:rw
      - ${ISAAC_CACHE}/logs:/isaac-sim/.nvidia-omniverse/logs:rw
      - ${ISAAC_CACHE}/config:/isaac-sim/.nvidia-omniverse/config:rw
      - ${ISAAC_CACHE}/data:/isaac-sim/.local/share/ov/data:rw
      - ${ISAAC_CACHE}/pkg:/isaac-sim/.local/share/ov/pkg:rw
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility, graphics, display]

